<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geetha & Co — Unique Bags</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        .royal-purple-gradient {
            background: linear-gradient(135deg, #4c1d95 0%, #1e1b4b 100%);
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">

    <!-- Sale Banner -->
    <div id="sale-banner-container" class="bg-amber-500 text-white text-center py-2 px-4 text-sm font-semibold tracking-wide shadow-sm transition-all duration-300">
        <span id="sale-banner-text">Loading special offers...</span>
    </div>

    <!-- Navigation Header -->
    <header class="royal-purple-gradient text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-amber-500 text-purple-900 font-bold p-2.5 rounded-xl shadow-inner text-xl tracking-wider">G&C</div>
                <div>
                    <h1 class="text-2xl font-extrabold tracking-tight">Geetha & Co</h1>
                    <p class="text-xs text-purple-200">The Shop for Unique Bags · Bodhan, Telangana</p>
                </div>
            </div>
            
            <!-- Global Search Interface -->
            <div class="w-full sm:w-72 relative">
                <input type="text" id="search-input" placeholder="Search bags..." 
                       class="w-full bg-white/10 border border-white/20 rounded-full py-2 px-4 pl-10 text-sm text-white placeholder-purple-200 focus:outline-none focus:ring-2 focus:ring-amber-400 focus:bg-white focus:text-gray-900 focus:placeholder-gray-400 transition-all">
                <span class="absolute left-3.5 top-2.5 text-purple-200 pointer-events-none">🔍</span>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <!-- Category Filters -->
        <div class="mb-8">
            <h3 class="text-sm font-bold uppercase tracking-wider text-gray-500 mb-3">Browse Categories</h3>
            <div id="category-chips-container" class="flex flex-wrap gap-2">
                <button data-category="all" class="category-chip px-4 py-1.5 rounded-full text-sm font-medium transition-all bg-purple-900 text-white shadow-sm">
                    All Bags
                </button>
                <!-- Dynamically filled categories -->
            </div>
        </div>

        <!-- System Announcement Message -->
        <div id="delivery-info-box" class="mb-8 bg-purple-50 border border-purple-100 rounded-xl p-4 flex items-start gap-3 text-purple-900 text-sm">
            <span class="text-lg">🚚</span>
            <p id="delivery-message-text" class="font-medium">Loading destination logistics rules...</p>
        </div>

        <!-- Product Catalog Main Grid -->
        <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- Loading States -->
            <div class="col-span-full text-center py-12 text-gray-500 font-medium">
                <div class="animate-pulse space-y-4">
                    <p class="text-lg">Assembling standard collections...</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-gray-900 text-gray-400 text-center py-8 mt-12 border-t border-gray-800 text-xs">
        <p class="font-semibold text-gray-300">Geetha & Co Bags &copy; 2026</p>
        <p class="mt-1">Bodhan, Telangana, India · Fast Dispatch Network Across India</p>
    </footer>

    <!-- Frontend Core Application Controller Scripts -->
    <script>
        const API_BASE = "http://localhost:8001/api";
        let state = {
            products: [],
            settings: {},
            activeCategory: "all",
            searchQuery: ""
        };

        // Initialize App Connection Handles
        async function bootStorefront() {
            try {
                const [prodRes, settRes] = await Promise.all([
                    fetch(`${API_BASE}/products`).catch(() => null),
                    fetch(`${API_BASE}/settings`).catch(() => null)
                ]);

                if (prodRes && prodRes.ok) state.products = await prodRes.json();
                if (settRes && settRes.ok) state.settings = await settRes.json();
                
                applySettings();
                renderCategoryFilters();
                renderProductGrid();
            } catch (error) {
                console.error("Degraded state activation trigger:", error);
                renderProductGrid(); // Fallback empty view trigger
            }
        }

        function applySettings() {
            if (state.settings.sale_banner) {
                document.getElementById("sale-banner-text").innerText = state.settings.sale_banner;
            }
            if (state.settings.delivery_message) {
                document.getElementById("delivery-message-text").innerText = state.settings.delivery_message;
            }
        }

        function renderCategoryFilters() {
            const container = document.getElementById("category-chips-container");
            const categories = new Set(state.products.map(p => p.category));
            
            categories.forEach(cat => {
                if(!cat) return;
                const btn = document.createElement("button");
                btn.className = "category-chip px-4 py-1.5 rounded-full text-sm font-medium transition-all bg-white text-gray-700 border border-gray-200 hover:bg-gray-100";
                btn.setAttribute("data-category", cat);
                btn.innerText = cat;
                container.appendChild(btn);
            });

            // Add Event Listeners to Category Toggles
            document.querySelectorAll(".category-chip").forEach(chip => {
                chip.addEventListener("click", (e) => {
                    document.querySelectorAll(".category-chip").forEach(c => {
                        c.className = "category-chip px-4 py-1.5 rounded-full text-sm font-medium transition-all bg-white text-gray-700 border border-gray-200 hover:bg-gray-100";
                    });
                    e.target.className = "category-chip px-4 py-1.5 rounded-full text-sm font-medium transition-all bg-purple-900 text-white shadow-sm";
                    state.activeCategory = e.target.getAttribute("data-category");
                    renderProductGrid();
                });
            });
        }

        function renderProductGrid() {
            const grid = document.getElementById("product-grid");
            grid.innerHTML = "";

            const filtered = state.products.filter(p => {
                const matchesCat = state.activeCategory === "all" || p.category === state.activeCategory;
                const matchesSearch = p.name.toLowerCase().includes(state.searchQuery.toLowerCase()) || 
                                      p.description.toLowerCase().includes(state.searchQuery.toLowerCase());
                return matchesCat && matchesSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-gray-400 bg-white border border-dashed border-gray-200 rounded-2xl">No unique items found matching filters.</div>`;
                return;
            }

            filtered.forEach(prod => {
                const hasDiscount = prod.discount_percent > 0;
                const isLowStock = prod.stock <= 5;
                
                const card = document.createElement("div");
                card.className = "bg-white rounded-2xl border border-gray-100 shadow-xs hover:shadow-md transition-all duration-200 overflow-hidden flex flex-col";
                card.setAttribute("data-testid", `product-card-${prod.id}`);

                card.innerHTML = `
                    <div class="relative bg-gray-100 pt-[100%]">
                        <img src="${prod.image_url || 'https://images.unsplash.com/photo-1581605405669-fcdf81165afa?w=500'}" 
                             alt="${prod.name}" class="absolute inset-0 w-full h-full object-cover">
                        ${prod.badge ? `<span class="absolute top-3 left-3 bg-purple-900 text-white text-[10px] uppercase font-bold tracking-wider px-2 py-0.5 rounded-md shadow-xs">${prod.badge}</span>` : ''}
                        ${hasDiscount ? `<span class="absolute top-3 right-3 bg-rose-500 text-white text-xs font-bold px-2 py-0.5 rounded-md shadow-xs">${prod.discount_percent}% OFF</span>` : ''}
                    </div>
                    
                    <div class="p-4 flex-1 flex flex-col justify-between">
                        <div>
                            <span class="text-xs text-purple-700 font-semibold tracking-wide uppercase">${prod.category}</span>
                            <h4 class="font-bold text-gray-900 text-base mt-0.5 line-clamp-1">${prod.name}</h4>
                            <p class="text-xs text-gray-500 mt-1 line-clamp-2">${prod.description || 'Premium build quality tailored for daily resilience.'}</p>
                            
                            <div class="flex items-center gap-2 mt-3">
                                <span class="text-gray-400 text-xs line-through">₹${prod.original_price || Math.round(prod.price * 1.3)}</span>
                                <span class="text-gray-900 text-lg font-black">₹${prod.price}</span>
                            </div>
                        </div>

                        <div class="mt-4 pt-3 border-t border-gray-50 flex items-center justify-between gap-2">
                            <div>
                                <span class="text-[11px] text-gray-400 block">Colour: <b class="text-gray-700 font-medium">${prod.color || 'Standard'}</b></span>
                                <span class="px-1.5 py-0.5 rounded-md text-[10px] font-bold inline-block mt-1 ${isLowStock ? 'bg-amber-50 text-amber-700 border border-amber-200' : 'bg-green-50 text-green-700'}">
                                    ${isLowStock ? `Only ${prod.stock} left` : 'In Stock'}
                                </span>
                            </div>
                            
                            <button onclick="triggerWhatsAppOrder('${prod.id}', '${prod.name}', ${prod.price})" 
                                    data-testid="order-whatsapp-btn-${prod.id}"
                                    class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold py-2 px-3.5 rounded-xl shadow-xs transition-colors flex items-center gap-1.5 cursor-pointer">
                                <span>Order</span> 💬
                            </button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function triggerWhatsAppOrder(id, name, price) {
            const waNumber = state.settings.whatsapp_number || "916304637007";
            const text = `Hello Geetha & Co, I would like to place an order for:\n\n🛍️ *Product:* ${name}\n🆔 *ID:* ${id}\n💰 *Price:* ₹${price}\n\nPlease confirm delivery availability. Thanks!`;
            window.open(`https://wa.me/${waNumber}?text=${encodeURIComponent(text)}`, '_blank');
        }

        // Setup Search Listener
        document.getElementById("search-input").addEventListener("input", (e) => {
            state.searchQuery = e.target.value;
            renderProductGrid();
        });

        // Initialize Storefront Execution
        bootStorefront();
    </script>
</body>
</html>
